services:
  - type: web
    name: ethical-ai-presentation-socket
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: SESSION_TTL_MS
        value: "7200000"
